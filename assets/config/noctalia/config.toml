# Noctalia v5 Configuration

[theme]
mode = "dark"
source = "community"
builtin = "Tokyo-Night"
community_palette = "Tokyo Night Moon"
pure_black_dark = false

[shell]
font_family = "sans-serif"
time_format = "{:%H:%M}"
date_format = "%A, %x"
avatar_path = "~/.face"
telemetry_enabled = false
app_icon_colorize = false
polkit_agent = true

[shell.shadow]
direction = "down_right"

[shell.panel]
transparency_mode = "soft"
launcher_placement = "floating"
launcher_position = "center"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"

[location]
auto_locate = false
address = "Kiel"

[weather]
enabled = true
unit = "celsius"
effects = true
refresh_minutes = 30

[nightlight]
enabled = true
force = false
temperature_day = 6500
temperature_night = 4000

[wallpaper]
enabled = true
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"
fill_color = "#000000"
transition = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_duration = 1500
edge_smoothness = 0.05
transition_on_startup = true

[wallpaper.default]
path = "~/Pictures/Wallpapers/tokyo_night-05.png"

[wallpaper.automation]
enabled = false
interval_seconds = 300
order = "random"

[bar]
order = ["default"]

[bar.default]
position = "top"
thickness = 34
margin_ends = 4
margin_edge = 4
padding = 6
widget_spacing = 6
concave_edge_corners = true
capsule = true
start = ["launcher", "clock", "group:system_usage", "media", "active_window"]
center = ["workspaces"]
end = ["tray", "notifications", "battery", "volume", "brightness", "widget", "control-center", "todo"]

[[bar.default.capsule_group]]
id = "system_usage"
enabled = true
members = ["cpu", "temp", "ram"]
accordion = false
accordion_direction = "end"
fill = "surface_container"
opacity = 1.0
padding = 6.0

[widget.launcher]
glyph = "rocket"

[widget.clock]
format = "{:%H:%M %a, %b %d}"
vertical_format = "{:%H %M - %d %m}"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
glyph = "cpu-usage"
show_glyph = true
show_value = false
label_show_units = false
visualization = "gauge"

[widget.temp]
type = "sysmon"
stat = "cpu_temp"
glyph = "temperature"
show_glyph = true
show_value = false
visualization = "gauge"

[widget.ram]
type = "sysmon"
stat = "ram_used"
glyph = "memory"
show_glyph = true
show_value = false
visualization = "gauge"

[widget.active_window]
display = "icon_and_text"
max_length = 145
title_scroll = "on_hover"

[widget.media]
artist_first = true
art_size = 16
hide_when_no_media = false

[widget.workspaces]
style = "regular"
show_labels = true
label_source = "id"
labels_only_when_occupied = true
focused_color = "primary"
occupied_color = "secondary"
empty_color = "secondary"

[widget.tray]
drawer = true
drawer_columns = 3

[widget.notifications]
hide_when_no_unread = false

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.volume]
device = "output"
show_label = false

[widget.brightness]
show_label = true

[widget.control-center]
glyph = "noctalia"

[control_center]
sidebar = "compact"

[notification]
enable_daemon = true
show_app_name = true
show_actions = true
layer = "top"
scale = 1.0
background_opacity = 0.97
offset_x = 20
offset_y = 8

[osd]
position = "top_right"
orientation = "horizontal"
scale = 1.0
background_opacity = 0.97
offset_x = 20
offset_y = 8

[audio]
enable_overdrive = false
enable_sounds = false
sound_volume = 0.5

[brightness]
enable_ddcutil = false
